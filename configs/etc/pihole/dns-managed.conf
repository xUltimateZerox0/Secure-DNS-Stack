# Pi-hole keys enforced by install.sh, secrets excluded.
# Format: KEY VALUE, applied with: pihole-FTL --config KEY VALUE
# Send all queries to local Unbound on port 5335.
dns.upstreams ["127.0.0.1#5335"]
# Answer on all interfaces, firewall limits who can reach port 53.
dns.listeningMode ALL
# Serve admin UI on HTTPS only, no port 80.
webserver.port 443os,[::]:443os
