server:
    # Managed by secure-dns-stack installer, local edits are replaced with backup.
    # Listen only on localhost, Pi-hole forwards here on port 5335.
    interface: 127.0.0.1
    port: 5335
    # Use IPv4 only, IPv6 upstream is unreachable on this network.
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    # Bundle for verifying Quad9 TLS certificates.
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
    # Single instance, no need for socket reuse.
    so-reuseport: no

    # Cache for speed, keep answers up to 1h minimum to cut upstream queries.
    prefetch: yes
    prefetch-key: yes
    num-threads: 2
    msg-cache-size: 128m
    rrset-cache-size: 256m
    cache-min-ttl: 3600
    cache-max-ttl: 86400
    so-rcvbuf: 1m

    # Hide our version, harden answers against spoofing.
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    # Send only the minimal query to each server for privacy.
    qname-minimisation: yes
    # Reuse DNSSEC proofs to answer missing names faster.
    aggressive-nsec: yes
    # Refuse ANY queries to cut amplification abuse.
    deny-any: yes
    # Allow queries to localhost, Pi-hole runs on 127.0.0.1.
    do-not-query-localhost: no

forward-zone:
    # Send all queries over TLS to Quad9 only.
    name: "."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
